name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Run PHP syntax check
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l
          echo "PHP syntax check passed for PHP ${{ matrix.php-version }}"

  wordpress-compatibility:
    name: WordPress ${{ matrix.wp-version }} / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    needs: php-lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp-version: '6.5'
            php-version: '8.1'
          - wp-version: '6.6'
            php-version: '8.2'
          - wp-version: '7.0'
            php-version: '8.2'
          - wp-version: '7.1'
            php-version: '8.3'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, pdo_mysql
          coverage: none

      - name: Install WordPress
        run: |
          mkdir -p /tmp/wordpress
          curl -sL https://wordpress.org/wordpress-${{ matrix.wp-version }}.tar.gz | tar xz -C /tmp
          cp -r . /tmp/wordpress/wp-content/plugins/wp-stellate

      - name: Download WPGraphQL
        run: |
          curl -sL https://downloads.wordpress.org/plugin/wp-graphql.latest-stable.zip -o /tmp/wp-graphql.zip
          unzip -q /tmp/wp-graphql.zip -d /tmp/wordpress/wp-content/plugins/

      - name: Create wp-config.php
        run: |
          cat > /tmp/wordpress/wp-config.php << 'EOF'
          <?php
          define('DB_NAME', 'wordpress_test');
          define('DB_USER', 'root');
          define('DB_PASSWORD', 'root');
          define('DB_HOST', '127.0.0.1');
          define('DB_CHARSET', 'utf8');
          define('DB_COLLATE', '');
          define('WP_DEBUG', true);
          define('WP_DEBUG_LOG', true);
          $table_prefix = 'wp_';
          define('AUTH_KEY', 'test');
          define('SECURE_AUTH_KEY', 'test');
          define('LOGGED_IN_KEY', 'test');
          define('NONCE_KEY', 'test');
          define('AUTH_SALT', 'test');
          define('SECURE_AUTH_SALT', 'test');
          define('LOGGED_IN_SALT', 'test');
          define('NONCE_SALT', 'test');
          if (!defined('ABSPATH')) {
              define('ABSPATH', __DIR__ . '/');
          }
          require_once ABSPATH . 'wp-settings.php';
          EOF

      - name: Verify plugin loads without errors
        run: |
          cd /tmp/wordpress
          php -r "
            define('ABSPATH', '/tmp/wordpress/');
            define('WPINC', 'wp-includes');
            require_once 'wp-includes/plugin.php';
            require_once 'wp-content/plugins/wp-stellate/wp-stellate.php';
            echo 'Plugin loaded successfully on PHP ${{ matrix.php-version }} for WordPress ${{ matrix.wp-version }}';
          "

  readme-check:
    name: Validate readme.txt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check readme.txt exists
        run: test -f readme.txt

      - name: Validate readme.txt format
        run: |
          grep -q "^=== Stellate ===" readme.txt || (echo "Missing plugin header" && exit 1)
          grep -q "^Tested up to:" readme.txt || (echo "Missing 'Tested up to' field" && exit 1)
          grep -q "^Stable tag:" readme.txt || (echo "Missing 'Stable tag' field" && exit 1)
          echo "readme.txt validation passed"

      - name: Check version consistency
        run: |
          README_VERSION=$(grep "^Stable tag:" readme.txt | sed 's/Stable tag: //')
          PLUGIN_VERSION=$(grep "Version:" wp-stellate.php | head -1 | sed 's/.*Version: //' | tr -d ' ')
          if [ "$README_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Version mismatch: readme.txt ($README_VERSION) vs wp-stellate.php ($PLUGIN_VERSION)"
            exit 1
          fi
          echo "Version consistency check passed: $README_VERSION"
